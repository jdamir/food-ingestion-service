services:
  postgres:
    image: postgres:15-alpine
    container_name: tracker-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: food_db
    ports:
      - "5434:5432"
    volumes:
      - pgdata_tracker:/var/lib/postgresql/data
      - ./deployment/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - tracker-network # Живет во внутренней сети трекера

  kafka:
    image: apache/kafka:latest
    container_name: tracker-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      tracker-network:
        aliases:
          - kafka

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tracker-app
    ports:
      - "8082:8080"
      - "8081:8081"
    environment:
      - DB_DSN=postgres://user:password@tracker-db:5432/food_db?sslmode=disable
      - KAFKA_BROKERS=kafka:29092
      - AUTH_SERVICE_ADDR=auth-service:50051 # Имя контейнера из auth-service
    depends_on:
      - postgres
      - kafka
    networks:
      - tracker-network   # Для связи с Postgres и Kafka
      - auth-shared-net   # Для связи по gRPC с внешним auth-service

volumes:
  pgdata_tracker:

networks:
  tracker-network:
    driver: bridge
  auth-shared-net:
    external: true
    name: auth-shared-network # Подключаемся к глобальной сети, созданной сервисом авторизации
