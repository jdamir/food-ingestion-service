services:
  postgres:
    image: postgres:15-alpine
    container_name: tracker-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: food_db
    ports:
      - "5434:5432"
    volumes:
      - pgdata_tracker:/var/lib/postgresql/data
      - ./deployment/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - tracker-network

  tracker-kafka:
    image: apache/kafka:latest
    container_name: tracker-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # ВАЖНО: EXTERNAL теперь слушает на 0.0.0.0 (интерфейсы докера)
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      # ВАЖНО: Перенаправляем внешних клиентов на имя 'tracker-kafka:9092' вместо localhost
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://tracker-kafka:29092,EXTERNAL://tracker-kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - tracker-network
      - auth-shared-net # <--- Добавили общую сеть для Кафки
    # Убираем aliases (имени контейнера и так достаточно, когда сеть общая)

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tracker-app
    ports:
      - "8082:8080"
      - "8081:8081"
    environment:
      - DB_DSN=postgres://user:password@tracker-db:5432/food_db?sslmode=disable
      - KAFKA_BROKERS=tracker-kafka:29092 # Внутренний сервис ходит по внутреннему порту 29092
      - AUTH_SERVICE_ADDR=auth-service:50051
    depends_on:
      - postgres
      - tracker-kafka # <-- Исправлена опечатка (было - kafka)
    networks:
      - tracker-network
      - auth-shared-net

volumes:
  pgdata_tracker:

networks:
  tracker-network:
    driver: bridge
  auth-shared-net:
    external: true
    name: auth-shared-network